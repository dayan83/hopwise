[project]
name = "hopwise"
version = "0.1.0"
description = "A Melbourne train assistant with PTV integration, OpenAI tool calling and reproducible evaluations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.52,<4",
    "python-dotenv>=1.2.4",
    "pydantic>=2,<3",
    "streamlit>=1.32,<2",
    "tzdata; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
